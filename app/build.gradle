plugins {
    id 'com.android.application'
}

// Each GitHub Actions run gets a higher version number, so a new APK installs over the old one (progress is kept).
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.jorgi.merdekamandarin'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jorgi.merdekamandarin'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
    }

    signingConfigs {
        // One fixed key for every build: Android only accepts an update signed with the same key.
        merdeka {
            storeFile rootProject.file('keystore/merdeka.jks')
            storePassword 'merdekamandarin'
            keyAlias 'merdeka'
            keyPassword 'merdekamandarin'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.merdeka
        }
        debug {
            signingConfig signingConfigs.merdeka
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['html']
    }

    // Personal sideloaded app: don't let release-time lint checks block the APK build.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Aligns kotlin-stdlib / -jdk7 / -jdk8 versions pulled in by AndroidX (avoids duplicate-class errors).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
