name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APKs (main + Liquid Glass V2)
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleClassicRelease assembleGlassRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Surface the Gradle error as an annotation so it shows on the run summary page.
            msg=$(grep -A 30 "What went wrong" build.log | head -60)
            [ -z "$msg" ] && msg=$(grep -iE "error|exception" build.log | head -40)
            [ -z "$msg" ] && msg=$(tail -40 build.log)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/classic/release/app-classic-release.apk MerdekaMandarin.apk
          cp app/build/outputs/apk/glass/release/app-glass-release.apk MerdekaMandarin-V2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MerdekaMandarin-apk
          path: |
            MerdekaMandarin.apk
            MerdekaMandarin-V2.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Merdeka Mandarin v1.${{ github.run_number }}
          body: |
            Unduh **MerdekaMandarin.apk** di bawah, lalu buka di HP Android untuk memasang.
            Pembaruan bisa langsung dipasang di atas versi lama; progres belajar tetap tersimpan.
          files: MerdekaMandarin.apk
          make_latest: true

      # The Liquid Glass option lives in its own release, v1.5-V2, refreshed on every build.
      - name: Publish 1.5-V2 (Liquid Glass)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.5-V2 >/dev/null 2>&1; then
            gh release upload v1.5-V2 MerdekaMandarin-V2.apk --clobber
          else
            gh release create v1.5-V2 MerdekaMandarin-V2.apk --target "${{ github.sha }}" --latest=false \
              --title "Merdeka Mandarin 1.5-V2 (Liquid Glass)" \
              --notes "Versi opsi kedua dengan tampilan Liquid Glass. Unduh **MerdekaMandarin-V2.apk** lalu pasang. Aplikasi ini bernama *Merdeka Mandarin V2* dan bisa dipasang berdampingan dengan aplikasi utama (progres belajarnya terpisah)."
          fi
